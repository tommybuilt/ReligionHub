<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReligionCompare Password Hash Tool</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #faf8f5;
      --card: #fffaf2;
      --border: #dbcdbd;
      --text: #3a2a1a;
      --muted: #6f5a46;
      --primary: #8b5e34;
      --primary-text: #faf8f5;
      --shadow: 0 18px 45px rgba(58, 42, 26, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(223, 199, 161, 0.22), transparent 30%), var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: min(100%, 760px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 94, 52, 0.18);
    }

    button {
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: var(--primary-text);
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.96);
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(139, 94, 52, 0.08);
      border: 1px solid rgba(139, 94, 52, 0.18);
      word-break: break-all;
      font-family: Consolas, "Courier New", monospace;
      min-height: 72px;
    }

    .note {
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(250, 245, 235, 0.9);
      border: 1px solid var(--border);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>ReligionCompare Password Hash Tool</h1>
    <p>Generate a SHA-256 hash for your admin password directly in your browser.</p>
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="off" />
    <button id="generate" type="button">Generate Hash</button>
    <div id="result" class="result" aria-live="polite"></div>
    <div class="note">Copy this hash and set it as ADMIN_PASSWORD_HASH in your Cloudflare Worker environment variables.</div>
  </main>
  <script>
    const passwordInput = document.getElementById('password');
    const generateButton = document.getElementById('generate');
    const result = document.getElementById('result');

    async function sha256Hex(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    generateButton.addEventListener('click', async () => {
      if (!passwordInput.value) {
        result.textContent = 'Enter a password first.';
        return;
      }

      result.textContent = 'Generating...';
      result.textContent = await sha256Hex(passwordInput.value);
    });
  </script>
</body>
</html>
